name: Library App CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ========================================
  # BACKEND TEST
  # ========================================

  backend-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Run backend tests
        working-directory: backend
        run: sh ./mvnw test


  # ========================================
  # FRONTEND TEST
  # ========================================

  frontend-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install dependencies
        working-directory: frontend
        run: npm ci


      - name: Run frontend tests
        working-directory: frontend
        run: npm test


  # ========================================
  # BUILD + PUSH
  # ========================================

  build-and-push:

    needs:
      - backend-test
      - frontend-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Generate image tag
        id: meta
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT


      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/library-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/library-backend:${{ steps.meta.outputs.TAG }} \
            ./backend


      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/library-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/library-frontend:${{ steps.meta.outputs.TAG }} \
            ./frontend


      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/library-backend:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/library-backend:${{ steps.meta.outputs.TAG }}


      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/library-frontend:latest

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/library-frontend:${{ steps.meta.outputs.TAG }}
